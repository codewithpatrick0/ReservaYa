<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap">
    <link rel="stylesheet" href="styles.css">
    <title>Datos de la reserva - La Rotonda</title>
</head>
<body>
    <header>
        <h1>La Rotonda</h1>
        <h2>Datos de la reserva</h2>
    </header>

    <main class="datos">
        <section class="container-datos">
            <div>
                <!--espacio para agregar horario y fecha en formulario-->
            </div>
            <h3>Completa tus datos</h3>
            <form action="">
                <label for="nombre">Nombre completo: </label>
                <input id="nombre" name="nombre" type="text" placeholder="Juan Pérez Quispe" required>

                <label for="telefono">Número de teléfono: </label>
                <input id="telefono" name="telefono" type="tel" placeholder="987654321" required>

                <input type="submit" value="Confirmar reserva">
            </form>

            <footer>
                <a href="reservas_fecha.html">Regresar</a>
            </footer>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Patrick Cabrera Esquén</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
